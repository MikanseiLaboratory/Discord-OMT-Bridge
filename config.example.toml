# Copy to config.toml. The user token is read from the DISCORD_TOKEN environment
# variable and is never stored in this file.
#
# Using a user token to join voice violates Discord's Terms of Service and can
# result in account termination. Use a dedicated account.

guild_id = "000000000000000000"
channel_id = "000000000000000000"

# More voice channels joined at the same time. Each entry is one seat.
# [[channels]]
# guild_id = "000000000000000000"
# channel_id = "000000000000000000"

# Join muted. Deaf would hide remote audio, so leave it false when capturing.
self_mute = true
self_deaf = false

# NDI is included in the default build and needs the NDI 6 SDK at runtime.
enable_omt = true
enable_ndi = true

source_prefix = "Discord"

# Empty allow list means every user except those in deny_user_ids.
allow_user_ids = []
deny_user_ids = []

# Maximum simultaneous Go Live watches.
max_streams = 8
# Receive transceivers allocated for remote video SSRCs.
max_video_slots = 8
# Outputs start empty. Add them in the desktop window, or list them here.
# name is the source name. transport is omt or ndi. kind is the selected input: audio, camera, or golive.
# channel_id and user_id of 0 mean no input yet. The same input can feed several outputs.
# [[outputs]]
# id = "out-1"
# name = "司会カメラ"
# transport = "ndi"
# kind = "camera"
# channel_id = "0"
# user_id = "0"
# Preferred simulcast quality (0-100). Higher means a larger layer.
prefer_quality = 100
# Seconds without media before an output is shown as idle. The sender stays open.
idle_timeout_secs = 5

# Override Discord's desktop client build number when Identify is rejected.
# Leave at 0 to fetch the current stable Windows build at startup.
client_build_number = 0
