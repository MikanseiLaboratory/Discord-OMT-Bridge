[package]
name = "egress"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
ndi = ["dep:grafton-ndi"]
asio = ["cpal/asio"]

[dependencies]
cpal = "0.15"
grafton-ndi = { workspace = true, optional = true }
openmediatransport = { workspace = true }
thiserror = { workspace = true }
vmx = { package = "vmx1", version = "0.1.0" }
tracing = { workspace = true }

[[bin]]
name = "colorbar"
path = "src/bin/colorbar.rs"
