[workspace]
resolver = "2"
members = [
    "crates/egress",
    "crates/discord-user-gateway",
    "crates/discord-media",
    "crates/app",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
davey = "0.1"
openh264 = { version = "0.6", default-features = false, features = ["source"] }
openmediatransport = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opus = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
bytes = "1"
grafton-ndi = "0.13"
